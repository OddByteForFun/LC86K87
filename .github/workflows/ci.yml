name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

# Version de Zig installee dans tous les jobs.
# Doit rester coherente avec minimum_zig_version de build.zig.zon.
env:
  ZIG_VERSION: '0.16.0'

jobs:
  test:
    name: Test ${{ matrix.optimize }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe]
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build library
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Run tests
        run: zig build test -Doptimize=${{ matrix.optimize }}

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches build.zig.zon
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $zon = Get-Content build.zig.zon -Raw
          if ($zon -match '\.version\s*=\s*"([^"]+)"') {
            $zonVersion = $Matches[1]
          } else {
            throw "Version introuvable dans build.zig.zon"
          }
          if ($tagVersion -ne $zonVersion) {
            throw "Le tag $env:GITHUB_REF_NAME annonce $tagVersion mais build.zig.zon annonce $zonVersion"
          }

      - name: Create GitHub Release
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            --verify-tag `
            --title "$env:GITHUB_REF_NAME" `
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}